<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NERIYADJ — in progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070a;color:#dfe7ef;overflow:hidden}
body{font-family:'Space Mono',monospace}
.stage{position:fixed;inset:0}
.bg,.slice{position:absolute;inset:-5%;background:url(bg.jpg) center/cover no-repeat;filter:grayscale(1) contrast(1.2) brightness(.5)}
.slice{opacity:0;mix-blend-mode:screen}
.veil{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(5,7,10,.1),rgba(5,7,10,.9) 78%)}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;mix-blend-mode:overlay}
.rays{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.ray{position:absolute;top:-50%;width:2px;height:200%;background:linear-gradient(transparent,rgba(220,235,255,.9),transparent);transform:rotate(-35deg);opacity:0;filter:blur(.5px)}
.scan{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
canvas#grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.09;mix-blend-mode:screen}
main{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:16px}
h1{font-family:'Unbounded',sans-serif;font-weight:800;font-size:clamp(2.4rem,11vw,9rem);letter-spacing:-.04em;line-height:.9;text-transform:uppercase;position:relative;white-space:nowrap}
h1 .ch{display:inline-block;will-change:transform}
.ghost{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0}
.ghost.c{color:#5fc8ff}.ghost.m{color:#ff3d63}
.status{margin-top:2.2rem;font-size:clamp(.75rem,2.6vw,1.05rem);letter-spacing:.5em;text-transform:uppercase;display:flex;align-items:center;gap:.8em;min-height:1.5em}
.dot{width:.6em;height:.6em;background:#ff2b4a;border-radius:50%;box-shadow:0 0 12px #ff2b4a}
.bar{margin-top:1.2rem;width:min(320px,70vw);height:2px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#dfe7ef}
.pct{margin-top:.7rem;font-size:.7rem;letter-spacing:.3em;opacity:.6}
.corner{position:fixed;font-size:.68rem;letter-spacing:.25em;opacity:.55;text-transform:uppercase}
.tl{top:16px;left:16px}.tr{top:16px;right:16px}.bl{bottom:16px;left:16px}.br{bottom:16px;right:16px}
.ticker{position:fixed;left:0;right:0;bottom:42px;overflow:hidden;white-space:nowrap;font-size:.65rem;letter-spacing:.4em;opacity:.28;text-transform:uppercase}
.ticker div{display:inline-block;padding-right:2em}
</style>
</head>
<body>
<div class="stage"><div class="bg"></div><div class="slice" id="s1"></div><div class="slice" id="s2"></div></div>
<div class="veil"></div>
<div class="rays" id="rays"></div>
<div class="scan"></div>
<canvas id="grain"></canvas>
<div class="flash" id="flash"></div>

<span class="corner tl">neriyadj.ru</span>
<span class="corner tr" id="clk">--:--:--</span>
<span class="corner bl">130 bpm</span>
<span class="corner br">msk // 55.75n 37.61e</span>
<div class="ticker"><div>techno // live sets // visuals // coming soon // techno // live sets // visuals // coming soon //</div><div>techno // live sets // visuals // coming soon // techno // live sets // visuals // coming soon //</div></div>

<main>
  <h1 id="t">Neriyadj</h1>
  <div class="status"><span class="dot"></span><span id="st">In progress</span></div>
  <div class="bar"><i id="bi"></i></div>
  <div class="pct" id="pct">000%</div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const t=$('#t'), word='Neriyadj';
t.innerHTML=[...word].map(c=>'<span class="ch">'+c+'</span>').join('')+'<span class="ghost c" aria-hidden="true">'+word+'</span><span class="ghost m" aria-hidden="true">'+word+'</span>';

// grain
const cv=$('#grain'),cx=cv.getContext('2d');
function sizeG(){cv.width=innerWidth/3|0;cv.height=innerHeight/3|0}sizeG();addEventListener('resize',sizeG);
(function g(){const d=cx.createImageData(cv.width,cv.height),b=d.data;for(let i=0;i<b.length;i+=4){const v=Math.random()*255;b[i]=b[i+1]=b[i+2]=v;b[i+3]=255}cx.putImageData(d,0,0);setTimeout(()=>requestAnimationFrame(g),60)})();

// rays
const rays=$('#rays');for(let i=0;i<7;i++){const r=document.createElement('i');r.className='ray';r.style.left=(i*16-10)+'%';rays.appendChild(r)}

setInterval(()=>{$('#clk').textContent=new Date().toLocaleTimeString('ru-RU',{timeZone:'Europe/Moscow'})},1000);

// scramble text
const CH='!<>-_\\/[]{}=+*^?#01ABCDEFXZ';
function scramble(el,txt,dur=1){const o={p:0};return gsap.to(o,{p:1,duration:dur,ease:'none',onUpdate(){const n=Math.floor(o.p*txt.length);el.textContent=txt.slice(0,n)+[...txt.slice(n)].map(c=>c===' '?' ':CH[Math.random()*CH.length|0]).join('')}})}

if(window.gsap){
  const ch=$$('.ch');
  gsap.set('.bg',{scale:1.3,opacity:0});
  const tl=gsap.timeline({defaults:{ease:'expo.out'}});
  tl.to('#flash',{opacity:.9,duration:.05,repeat:5,yoyo:true,ease:'steps(1)'})
    .to('.bg',{opacity:1,scale:1.05,duration:2.4},'<')
    .from(ch,{y:()=>gsap.utils.random(-160,160),x:()=>gsap.utils.random(-80,80),rotate:()=>gsap.utils.random(-60,60),scale:()=>gsap.utils.random(.2,2.4),opacity:0,filter:'blur(16px)',duration:1.2,stagger:{each:.05,from:'random'}},'-=2')
    .add(()=>scramble($('#st'),'In progress',1.2),'-=.6')
    .from('.status',{opacity:0,letterSpacing:'1.6em',duration:1.2},'<')
    .from('.corner,.ticker',{opacity:0,y:10,duration:.6,stagger:.07},'-=.8')
    .add(()=>$$('.corner').forEach(c=>scramble(c,c.textContent,.8)),'<');

  // loader that never quite finishes
  const L={v:0};
  gsap.to(L,{v:87,duration:9,ease:'power2.out',delay:1.5,onUpdate(){$('#bi').style.width=L.v+'%';$('#pct').textContent=String(Math.round(L.v)).padStart(3,'0')+'%'}});
  gsap.to('.dot',{opacity:.15,duration:.46,repeat:-1,yoyo:true,ease:'steps(1)',delay:2});
  gsap.to('.ticker div',{xPercent:-100,duration:30,ease:'none',repeat:-1});

  // kick on 130 bpm
  const beat=60/130;let n=0;
  gsap.delayedCall(2.6,function kick(){
    n++;
    gsap.fromTo('#t',{scale:1.035},{scale:1,duration:beat*.9,ease:'power3.out'});
    gsap.fromTo('.bg',{scale:1.075},{scale:1.05,duration:beat*.9,ease:'power2.out'});
    gsap.fromTo('.veil',{opacity:.75},{opacity:1,duration:beat*.8});
    if(n%4===0) gsap.fromTo('.ray',{opacity:0,xPercent:-400},{opacity:()=>gsap.utils.random(.2,.7),xPercent:400,duration:beat*2,stagger:.04,ease:'power2.inOut',onComplete(){gsap.set('.ray',{opacity:0})}});
    if(n%8===0) glitch();
    if(n%16===0) scramble($('#st'),['In progress','Loading set','Neriyadj.ru','In progress'][(n/16)%4],.9);
    gsap.delayedCall(beat,kick);
  });

  function glitch(){
    const cut=()=>{const a=gsap.utils.random(10,70);return `inset(${a}% 0 ${100-a-gsap.utils.random(3,14)}% 0)`};
    gsap.timeline()
     .set('.ghost',{opacity:.8})
     .to('.ghost.c',{x:-8,y:2,duration:.05,repeat:5,yoyo:true,ease:'steps(1)'},0)
     .to('.ghost.m',{x:8,y:-2,duration:.05,repeat:5,yoyo:true,ease:'steps(1)'},0)
     .set('#s1',{opacity:.9,clipPath:cut(),x:gsap.utils.random(-60,60)},0)
     .set('#s2',{opacity:.7,clipPath:cut(),x:gsap.utils.random(-90,90)},.08)
     .to(ch,{x:()=>gsap.utils.random(-14,14),skewX:()=>gsap.utils.random(-25,25),duration:.04,repeat:3,yoyo:true,stagger:.01},0)
     .to('#flash',{opacity:.35,duration:.04,repeat:1,yoyo:true},.1)
     .set('.ghost,#s1,#s2',{opacity:0,x:0,y:0},.32)
     .set(ch,{x:0,skewX:0},.34);
  }

  // parallax + letters react to the pointer
  addEventListener('pointermove',e=>{
    const dx=e.clientX/innerWidth-.5,dy=e.clientY/innerHeight-.5;
    gsap.to('.stage',{x:dx*-40,y:dy*-40,duration:1.4,ease:'power2.out'});
    gsap.to('#t',{rotateY:dx*14,rotateX:-dy*14,duration:1,transformPerspective:900});
    ch.forEach(c=>{const r=c.getBoundingClientRect(),d=Math.hypot(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2));gsap.to(c,{y:d<160?-(160-d)/6:0,duration:.5})});
  });
  addEventListener('pointerdown',glitch);
}
</script>
</body>
</html>
